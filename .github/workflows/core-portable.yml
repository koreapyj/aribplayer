name: Core portable

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  logic-tests:
    name: Portable core logic tests (Linux, gcc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install libcurl and Ninja
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev ninja-build
      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DWVP_PORTABLE_CORE=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
      - name: Build
        shell: bash
        run: cmake --build build
      - name: Run PlayerCore.LogicTests
        shell: bash
        run: ctest --test-dir build --output-on-failure -R '^PlayerCore\.LogicTests$'

  libffplay-compile:
    name: libffplay compile (Linux, gcc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install quilt and SDL2
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends quilt libsdl2-dev pkg-config
      - name: Stage the patched FFmpeg tree
        shell: bash
        run: |
          set -euo pipefail
          . ffmpeg/scripts/lib.sh
          WORK="$RUNNER_TEMP/ffmpeg-work"
          mkdir -p "$WORK"
          load_lock
          ensure_builder
          ensure_pristine
          sync_ours_into_builder
          stage_tree "$WORK/tree" 0
          cd "$WORK/tree"
          QUILTRC="$WORK/builder-ffmpeg/.quiltrc" QUILT_PATCHES=debian/patches quilt push -a > /dev/null
      - name: Configure (minimal, SDL2)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ffmpeg-build"
          cd "$RUNNER_TEMP/ffmpeg-build"
          "$RUNNER_TEMP/ffmpeg-work/tree/configure" --disable-autodetect --enable-sdl2 --enable-ffplay \
            --disable-ffmpeg --disable-ffprobe --disable-doc --disable-x86asm --enable-shared --disable-static
      - name: Compile libffplay and ffcapsdump
        shell: bash
        run: make -C "$RUNNER_TEMP/ffmpeg-build" -j"$(nproc)" fftools/ffplay.o fftools/ffcapsdump.o
